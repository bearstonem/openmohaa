// Deploy with:
//
//   adb push misc/android/autoexec.cfg \
//     /sdcard/Android/data/org.openmoh.openmohaa/files/main/autoexec.cfg
//   adb shell am force-stop org.openmoh.openmohaa
//
// Then launch from inside the headset. Never adb shell am start.
//
// Not packaged into the APK - it goes next to the game data, which is where the
// filesystem looks for it. Reinstalling the APK keeps it; clearing app data or
// reflashing the game files loses it, which is why it lives here.
//
// Working state for the VR port, restored.
//
// This is the exact configuration that rendered terrain, structures, models and
// sky correctly on the device. It is a WORKAROUND, not a fix: two of these are
// diagnostic overrides that disable real parts of the pipeline. See
// VR_RENDERER_HANDOFF.md section 9.
//
// autoexec.cfg is exec'd after omconfig.cfg, cannot come from a pk3, and lands
// before R_Init - so these values beat both the stored config and the
// renderer's own defaults. It is the only way to set a cvar with no console.

// --- load bearing: the world does not draw without these ---

// Backface culling off. Confirmed by bisection: turning this back on is what
// removes the world. Costs fill rate - every surface is rasterised from both
// sides - and it is not understood, because inverting the culled face instead
// of disabling it does NOT bring the world back, which no winding fault
// explains.
set r_noCull 1

// Depth testing off. Not sufficient on its own, but the working state had it
// off and removing it has not been retested in isolation. Draw order decides
// what is in front, so expect sorting artifacts on transparent surfaces.
set r_noDepth 1

// --- confirmed NOT needed: fog is fine, leave it on ---
set r_noFog 0

// --- everything else at its normal value ---
set r_primitives 0
set r_flatColor 0
set r_traceSurf 0
set r_forceGenericStage 0
set r_invertCull 0
set r_ext_multitexture 1
set r_vertexLight 0

// Print-only, and proven so: g_nSplit/g_nMerge are incremented and printed and
// never read. Kept because they were set in the run that worked and this
// configuration has shown run-to-run variation. If logcat spam is a problem
// these are the first two to drop.
set developer 1
set ter_count 1
