// Deploy with:
//
//   adb push misc/android/autoexec.cfg \
//     /sdcard/Android/data/org.openmoh.openmohaa/files/main/autoexec.cfg
//   adb shell am force-stop org.openmoh.openmohaa
//
// Then launch from inside the headset. Never adb shell am start.
//
// Not packaged into the APK - it goes next to the game data, which is where the
// filesystem looks for it. Reinstalling the APK keeps it; clearing app data or
// reflashing the game files loses it, which is why it lives here.
//
// autoexec.cfg is exec'd after omconfig.cfg, cannot be loaded from a pk3, and
// lands before R_Init - so it beats both the stored config and the renderer's
// own defaults, latched and archived cvars included. It is the only way to set
// a cvar on a device with no console.
//
// Nothing here is load bearing any more. The overrides that used to be needed
// to see the world at all - r_noCull in particular - were working around the
// gl4es cull face cache, fixed in GL_Cull. Every knob is set explicitly rather
// than left out, so a stale omconfig.cfg cannot change the result.

// Renderer diagnostics. All off.
set r_flatColor 0
set r_traceSurf 0
set r_forceGenericStage 0
set r_noCull 0
set r_noDepth 0
set r_noFog 0
set r_invertCull 0

// Normal renderer settings, stated so they cannot drift.
set r_primitives 0
set r_ext_multitexture 1
set r_vertexLight 0

// Engine diagnostics. All off.
set developer 0
set ter_count 0
