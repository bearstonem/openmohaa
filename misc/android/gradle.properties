android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m

# Where the CMake build staged the native libraries, relative to this
# directory. Overridable so a build tree anywhere can be packaged:
#
#   gradle assembleDebug -PnativeLibsDir=/path/to/build/apk-libs
#
nativeLibsDir=../../build-android-arm64/apk-libs

# The SDL source tree the engine was built against; the APK needs the
# org.libsdl.app Java classes from it, and they must match libSDL2.so. The
# CMake build reports the path it used as SDL2_JAVA_DIR.
sdlJavaDir=
